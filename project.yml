name: EasyRSS
options:
  bundleIdPrefix: com.bezelye
  defaultConfig: Release
  deploymentTarget:
    macOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      LLVM_LTO: YES_THIN
      DEAD_CODE_STRIPPING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      COPY_PHASE_STRIP: YES
      DEPLOYMENT_POSTPROCESSING: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  EasyRSS:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
        excludes:
          - "Resources/EasyRSS.entitlements"
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: EasyRSS
        PRODUCT_BUNDLE_IDENTIFIER: com.bezelye.EasyRSS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sources/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: EasyRSS
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 bezelye404. All rights reserved."
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 0.2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/EasyRSS.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
    frameworks:
      - framework: WebKit.framework
      - framework: AVFoundation.framework
      - framework: MediaPlayer.framework
