name: Versoline
options:
  bundleIdPrefix: com.bezelye
  defaultConfig: Release
  deploymentTarget:
    macOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      LLVM_LTO: YES_THIN
      DEAD_CODE_STRIPPING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      COPY_PHASE_STRIP: YES
      DEPLOYMENT_POSTPROCESSING: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  VersolineWidget:
    type: app-extension
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Widget
        excludes:
          - "VersolineWidget.entitlements"
      - path: Sources/Models/WidgetSnapshot.swift
      - path: Sources/Models/WidgetPalette.swift
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Versoline
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: VersolineWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.bezelye.Versoline.Widget
        APP_GROUP_ID: group.com.bezelye.Versoline
        CURRENT_PROJECT_VERSION: 9
        MARKETING_VERSION: 0.4.1
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Widget/VersolineWidget.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.bezelye.Versoline.dev.Widget
          APP_GROUP_ID: group.com.bezelye.Versoline.dev
          ENABLE_DEBUG_DYLIB: NO

  Versoline:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
        excludes:
          - "Resources/Versoline.entitlements"
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: Versoline
        PRODUCT_BUNDLE_IDENTIFIER: com.bezelye.Versoline
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sources/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Versoline
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 bezelye404. All rights reserved."
        CURRENT_PROJECT_VERSION: 9
        MARKETING_VERSION: 0.4.1
        APP_GROUP_ID: group.com.bezelye.Versoline
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/Versoline.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        # Debug builds are a separate app ("Versoline Dev"): own bundle identifier, own sandbox
        # container and own settings, so trying a build never touches the real library.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.bezelye.Versoline.dev
          INFOPLIST_KEY_CFBundleDisplayName: Versoline Dev
          INFOPLIST_KEY_CFBundleName: Versoline Dev
          APP_GROUP_ID: group.com.bezelye.Versoline.dev
          ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - target: VersolineWidget
        embed: true
    frameworks:
      - framework: WebKit.framework
      - framework: AVFoundation.framework
      - framework: MediaPlayer.framework

  VersolineTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
    dependencies:
      - target: Versoline
